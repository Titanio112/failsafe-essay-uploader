[plataforma]
base_url = https://www.esquemaredacao.com.br
login_path = /auth/users/sign_in
estilo_correcao = ENEM
headless = false
slow_mo_ms = 250

[dados]
pasta_raiz = redacoes_pendentes
pasta_teste = testes/redacoes_teste
planilha = Alunos para corrigir redacoes.xlsx
extensoes = .jpg
# Código no início do NOME DA PASTA (número + separador)
padrao_codigo_pasta = ^\s*(\d+)(?=[\s_.-]|$)
# Código no texto do tema do combo (número + " - " ou espaço/fim)
padrao_codigo_tema = ^\s*(\d+)(?=\s*-|\s|$)

[planilha]
aba =
coluna_nome = nome
coluna_email = email
coluna_sala = sala

[conciliacao]
limiar_fuzzy = 95
margem_minima = 8
exigir_aprovacao_fuzzy = true

[seguranca]
max_envios_por_aluno = 4
max_envios_teste = 5
# Envio real NÃO é liberado neste arquivo. Use somente a flag --envio-real
# e a confirmação textual exigida pelo programa.

[esperas]
upload_timeout_segundos = 120
confirmacao_timeout_segundos = 120
poll_lista_segundos = 5
pausa_envio_min_segundos = 8
pausa_envio_max_segundos = 15
pausa_aluno_min_segundos = 5
pausa_aluno_max_segundos = 10
max_tentativas_navegacao = 2
max_tentativas_codigo = 3
max_falhas_login_consecutivas = 3

[progresso]
banco_sqlite = progresso.db
pasta_relatorios = relatorios
pasta_diagnosticos = diagnosticos
pasta_logs = logs

[teste]
email_env = ESQUEMA_EMAIL_TESTE
senha_env = ESQUEMA_SENHA_TESTE
confirmacao_texto = ENVIAR TESTE
nome_virtual = Usuario Testes Ignorar
